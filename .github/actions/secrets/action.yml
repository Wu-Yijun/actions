name: 'Fetch and Decrypt Secrets'
description: 'Composite Action to decrypt files from secrets repository'

inputs:
  access-token:
    description: 'GitHub token to access the repository'
    required: true
  age-key:
    description: 'The age encryption key to decrypt the files'
    required: true
  file-list:
    description: 'List of files to fetch from secrets (comma-separated)'
    required: true
  output-path:
    description: 'Directory to save the decrypted files'
    required: false
    default: ./secrets/ 

runs:
  using: 'composite'
  steps:
    - name: 'Decrypt files'
      shell: bash
      run: |
        # Inputs
        ACCESS_TOKEN='${{ inputs.access-token }}'
        AGE_KEY='${{ inputs.age-key }}'
        FILE_LIST='${{ inputs.file-list }}'
        OUTPUT_PATH='${{ inputs.output-path }}'
        
        # GitHub API URL and Headers
        GITHUB_API_URL="https://api.github.com"
        HEADERS="Authorization: token $ACCESS_TOKEN"
        
        # Create output directory if it doesn't exist
        mkdir -p $OUTPUT_PATH
        
        # Convert file list from comma-separated to array
        IFS=',' read -r -a FILES <<< "$FILE_LIST"
        
        # Loop through each file and decrypt it
        for FILE in "${FILES[@]}"
        do
          RESPONSE=$(curl -s -H "$HEADERS" "$GITHUB_API_URL/repos/Wu-Yijun/secrets/contents/$FILE")
          echo "$RESPONSE"
          # Fetch the encrypted file from the GitHub secrets repository
          ENCRYPTED_FILE=$(echo "$RESPONSE" | jq -r '.content')
        
          # Check if the file content was fetched
          if [ "$ENCRYPTED_FILE" == "null" ]; then
            echo "File '$FILE' not found in the secrets repository."
            exit 1
          fi
        
          # Decode the file content from base64
          echo "$ENCRYPTED_FILE" | base64 --decode > "$FILE.enc"
        
          # Decrypt the file using 'age' and the provided key
          age --decrypt --identity <(echo "$AGE_KEY") -i "$FILE.enc" -o "$OUTPUT_PATH/$FILE"
        
          # Clean up the encrypted file
          rm "$FILE.enc"
        done
        
        echo "Decryption complete. Files are saved to $OUTPUT_PATH."
