name: 'Fetch and Decrypt Secrets'
description: 'Composite Action to decrypt files from secrets repository'

inputs:
  access-token:
    description: 'GitHub token to access the repository'
    required: true
  age-key:
    description: 'The age encryption key to decrypt the files'
    required: true
  file-list:
    description: 'List of files to fetch from secrets (comma-separated)'
    required: true
  output-path:
    description: 'Directory to save the decrypted files'
    required: false
    default: ./secrets

runs:
  using: 'composite'
  steps:
    # - name: Execute script.js in relative path
    #   shell: bash
    #   run: |
    #     node ${{ github.action_path }}/scripts.js

    - name: Create a temporary directory
      id: create-temp-dir
      shell: bash
      run: |
        tempDir='${{ inputs.output-path }}/temp'
        mkdir -p $tempDir
        echo "temp_dir=$(pwd)/$tempDir" >> "$GITHUB_OUTPUT"
        echo "${{ inputs.age-key }}" > "${{ inputs.output-path }}/temp.key"
        
    - name: Checkout private repository using PAT
      uses: actions/checkout@v4
      with:
        repository: 'Wu-Yijun/secrets'
        path: ${{ steps.create-temp-dir.outputs.temp_dir }}
        token: ${{ inputs.access-token }}
    - name: Manually install age
      shell: bash
      run: |
        # Download the latest binary for Linux/amd64
        sudo curl -sL https://dl.filippo.io/age/latest?for=linux/amd64 | sudo tar xz --strip-components=1 -C /usr/local/bin

        # ensure execute permission
        sudo chmod +x /usr/local/bin/age /usr/local/bin/age-keygen
    - name: 'Decrypt files'
      shell: bash
      id: main
      run: |
        FILE_LIST='${{ inputs.file-list }}'
        OUTPUT_PATH='${{ inputs.output-path }}'
        # Initialize an empty JSON object
        OUTPUT_JSON="{}"

        ################## Convert file list from new-line-separated to array ##################
        while IFS= read -r FILES; do
            # trim the space around
            FILE=$(echo "$FILES" | xargs)
        
            # If the line is not empty
            if [ -n "$FILE" ]; then

              # Decrypt the file using 'age' and the provided key
              age --decrypt --identity "$OUTPUT_PATH/temp.key" -o "$OUTPUT_PATH/temp.dec" "$OUTPUT_PATH/temp/$FILE"
              
              ################## Extract the directory from the file name ##################
              dirName="$OUTPUT_PATH/$(dirname "$FILE")"
              mkdir -p "$dirName"
              # Check if the file name ends with .bin
              if [[ "$FILE" =~ \.bin$ ]]; then
                  # Remove the .bin extension
                  FILE="${FILE%.bin}"
                  
              # Check if the file name ends with .txt
              elif [[ "$FILE" =~ \.txt$ ]]; then
                  FILE="${FILE%.txt}"
                  # Echo directly to shell like "fileNameNoPath: xxx"
                  # echo "$SECRET_NAME=$SECRET_VALUE" >> $GITHUB_OUTPUT
                  value=$(cat "$OUTPUT_PATH/temp.dec")
                  key="$(basename "$FILE")"
                  OUTPUT_JSON=$(echo "$OUTPUT_JSON" | jq --arg k "$key" --arg v "$value" '. + {($k): $v}')
                  echo "Add Secret text $key to output json"
        
              fi
              mv "$OUTPUT_PATH/temp.dec" "$OUTPUT_PATH/$FILE"
            
            fi
        done < <(echo "$FILE_LIST")

        ################## Clean up the files ##################
        rm "$OUTPUT_PATH/temp.key"
        rm -r "$OUTPUT_PATH/temp"
        echo "Decryption complete. Files are saved to $OUTPUT_PATH."

        ################## Set output ##################
        # Escape the final JSON string for the output variable
        # `tr` removes newlines, which is essential for single-line output
        ESCAPED_JSON=$(echo "$OUTPUT_JSON" | jq -c | tr -d '\n')

        # Set the composite action output
        echo "secrets=$ESCAPED_JSON" >> $GITHUB_OUTPUT

outputs:
  secrets:
    description: 'A JSON string with dynamically generated secrets TEXTs'
    value: ${{ steps.main.outputs.secrets }}
