name: 'Fetch and Decrypt Secrets'
description: 'Composite Action to decrypt files from secrets repository'

inputs:
  access-token:
    description: 'GitHub token to access the repository'
    required: true
  age-key:
    description: 'The age encryption key to decrypt the files'
    required: true
  file-list:
    description: 'List of files to fetch from secrets (comma-separated)'
    required: true
  output-path:
    description: 'Directory to save the decrypted files'
    required: false
    default: ./secrets

runs:
  using: 'composite'
  steps:
    # - name: Execute script.js in relative path
    #   shell: bash
    #   run: |
    #     node ${{ github.action_path }}/scripts.js

    - name: Manually install age
      shell: bash
      run: |
        # Download the latest binary for Linux/amd64
        curl -sL https://dl.filippo.io/age/latest?for=linux/amd64 | tar xz
  
        # Move the age binary to a directory in the PATH
        sudo mv age/age /usr/local/bin/
        sudo mv age/age-keygen /usr/local/bin/
        rm -rf age/
    - name: 'Decrypt files'
      shell: bash
      run: |
        # Inputs
        ACCESS_TOKEN='${{ inputs.access-token }}'
        AGE_KEY='${{ inputs.age-key }}'
        FILE_LIST='${{ inputs.file-list }}'
        OUTPUT_PATH='${{ inputs.output-path }}'
        
        # GitHub API URL and Headers
        GITHUB_API_URL="https://api.github.com"
        HEADERS="Authorization: token $ACCESS_TOKEN"
        
        # Create output directory if it doesn't exist
        mkdir -p $OUTPUT_PATH
        
        # Convert file list from comma-separated to array
        IFS=',' read -r -a FILES <<< "$FILE_LIST"
        ############################# line 16
        # Loop through each file and decrypt it
        for FILE in "${FILES[@]}"
        do
          RESPONSE=$(curl -s -H "$HEADERS" "$GITHUB_API_URL/repos/Wu-Yijun/secrets/contents/$FILE")
          echo "$RESPONSE"
          # Fetch the encrypted file from the GitHub secrets repository
          ENCRYPTED_FILE=$(echo "$RESPONSE" | jq -r '.content')
        
          # Check if the file content was fetched
          if [ "$ENCRYPTED_FILE" == "null" ]; then
            echo "File '$FILE' not found in the secrets repository."
            exit 1
          fi
          ############################# line 30
          # extract file dir
          # Example file name (replace this with your actual variable)

          mkdir -p "$OUTPUT_PATH"
          # Decode the file content from base64
          echo "$ENCRYPTED_FILE" | base64 --decode > "$OUTPUT_PATH/temp.enc"
          echo "$AGE_KEY" > "$OUTPUT_PATH/temp"
          # Decrypt the file using 'age' and the provided key
          echo "$(age -h)"
          age --decrypt --identity "$OUTPUT_PATH/temp" -o "$OUTPUT_PATH/temp.dec" "$OUTPUT_PATH/temp.enc"

          # Extract the directory from the file name
          dirName="$OUTPUT_PATH/$(dirname "$FILE")"
          mkdir -p "$dirName"
          # Check if the file name ends with .bin
          if [[ "$FILE" =~ \.bin$ ]]; then
              ############################# line 45
              # Remove the .bin extension
              FILE="${FILE%.bin}"
              
          # Check if the file name ends with .txt
          elif [[ "$FILE" =~ \.txt$ ]]; then
              FILE="${FILE%.txt}"
              # Echo directly to shell like "fileNameNoPath: xxx"
              # echo "$SECRET_NAME=$SECRET_VALUE" >> $GITHUB_OUTPUT
              SECRET_VALUE=$(cat "$OUTPUT_PATH/temp.dec")
              echo "$(basename "$FILE")=$SECRET_VALUE" >> $GITHUB_OUTPUT

          fi
          mv "$OUTPUT_PATH/temp.dec" "$OUTPUT_PATH/$FILE"

          ############################# line 60
        done
        # Clean up the encrypted file
        rm "$OUTPUT_PATH/temp.enc"
        ############################# line 40
        echo "Decryption complete. Files are saved to $OUTPUT_PATH."
