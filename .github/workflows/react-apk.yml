name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      SIGNING_KEY_ALIAS:
        required: true
        type: string
      SIGNING_KEY_PASSWORD:
        required: true
        type: string
      SIGNING_STORE_PASSWORD:
        required: true
        type: string
        
      keystore:
        required: true
        type: string
        default: ./android/app/keystore.jks
      input:
        required: true
        type: string
        default: ./test/app-release-unsigned.apk
      output:
        required: false
        type: string
        default: ./test/app-release.apk

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    environment: production  # 指定环境，确保访问该环境的 secrets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
      
      - name: Find latest build-tools version
        id: get_build_tools
        run: |
          BUILD_TOOLS_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | sort -rV | head -n 1)
          echo "build_tools_version=$BUILD_TOOLS_VERSION"
          echo "build_tools_version=$BUILD_TOOLS_VERSION" >> $GITHUB_OUTPUT
        
      - name: Manual Zipalign and Sign APK
        env:
          BUILD_TOOLS_VERSION: ${{ steps.get_build_tools.outputs.build_tools_version }}
          SIGNING_KEY_ALIAS: ${{ inputs.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ inputs.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ inputs.SIGNING_STORE_PASSWORD }}
        run: |
          UNSIGNED_APK="${{inputs.input}}"
          SIGNED_APK="${{inputs.output}}"
          ALIGNED_APK="$SIGNED_APK.temp"

          mkdir -p "$(basename SIGNED_APK)"

          # Zipalign the unsigned APK
          /usr/local/lib/android/sdk/build-tools/${BUILD_TOOLS_VERSION}/zipalign -v -p 4 ${UNSIGNED_APK} ${ALIGNED_APK}

          # Sign the aligned APK with v1 and v2 schemes
          /usr/local/lib/android/sdk/build-tools/${BUILD_TOOLS_VERSION}/apksigner sign --ks '${{inputs.keystore}}' --ks-key-alias ${SIGNING_KEY_ALIAS} --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD --out ${SIGNED_APK} ${ALIGNED_APK}

          rm "$ALIGNED_APK"

      - name: Verify signed APK
        env:
          BUILD_TOOLS_VERSION: ${{ steps.get_build_tools.outputs.build_tools_version }}
        run: |
          /usr/local/lib/android/sdk/build-tools/${BUILD_TOOLS_VERSION}/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk


      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
        
      # - uses: actions/upload-artifact@main
      #   with:
      #     name: '${{inputs.app_name}}_react_apk'
      #     path: android/app/build/outputs/apk/release/app-release-signed.apk
      #     retention-days: 7
